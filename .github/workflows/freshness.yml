# Fails when a newer Electron patch release exists than the one the app uses, so a
# Chromium security fix is never noticed late; a newer major version is only reported.
# GitHub notifies the owner of a failed scheduled run.
name: Electron freshness

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: electron-freshness
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Compare with the npm registry
        run: node tools/ci/electron-freshness.ts

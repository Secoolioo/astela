packages:
  - app
  - tools
  - website

# Only these dependencies may run install scripts. Squirrel.Windows is not used, so the
# installer of electron-winstaller stays blocked.
allowBuilds:
  electron: true
  electron-winstaller: false
  lefthook: true

# dependency-cruiser loads TypeScript at runtime without declaring it. It needs the
# TypeScript 6 API, so the tools package provides that version as its peer.
packageExtensions:
  dependency-cruiser@18:
    peerDependencies:
      typescript: '>=5 <7'

# Patched packages get a '=' in their store path, which fpm cannot handle; shorter
# directory names replace that part with a hash.
virtualStoreDirMaxLength: 60

# Development tools pull in versions with known vulnerabilities whose authors have not
# updated them yet: markdownlint (re2js, katex). These overrides use the fixed versions
# until they do. None of them is part of the browser. TypeDoc and electron-builder need
# minimatch 9 or 10, where GHSA-g3hv-75wg-m249 has no fix, and minimatch 11 breaks them.
# Both match only the patterns of this repository's configuration, so the denial of
# service that the advisory describes cannot be started from outside.
overrides:
  re2js@<2.8.7: 2.9.1
  katex@<0.18.2: 0.18.10

patchedDependencies:
  '@ghostery/adblocker@2.20.3': patches/@ghostery__adblocker@2.20.3.patch
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch

# pnpm installs only versions published at least a day ago. An Electron security patch has
# to ship sooner (see the response times in docs/maintainers/WORKFLOW.md), so its exact
# version is exempt; the next Electron update replaces the entry.
minimumReleaseAgeExclude:
  - electron@45.2.3

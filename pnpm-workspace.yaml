packages:
  - app
  - tools
  - website

# Only these dependencies may run install scripts. Squirrel.Windows is not used, so the
# installer of electron-winstaller stays blocked.
allowBuilds:
  electron: true
  electron-winstaller: false
  lefthook: true

# dependency-cruiser loads TypeScript at runtime without declaring it. It needs the
# TypeScript 6 API, so the tools package provides that version as its peer.
packageExtensions:
  dependency-cruiser@18:
    peerDependencies:
      typescript: '>=5 <7'

# Patched packages get a '=' in their store path, which fpm cannot handle; shorter
# directory names replace that part with a hash.
virtualStoreDirMaxLength: 60

patchedDependencies:
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch

# pnpm installs only versions published at least a day ago. An Electron security patch has
# to ship sooner (see the response times in docs/maintainers/WORKFLOW.md), so its exact
# version is exempt; the next Electron update replaces the entry.
minimumReleaseAgeExclude:
  - electron@45.2.1

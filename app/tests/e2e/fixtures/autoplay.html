<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture autoplay</title>
  </head>
  <body>
    <h1>Fixture autoplay</h1>
    <p>As it loads, the page starts a tone and two videos with their sound, without a click.</p>
    <video id="played" src="/clip.webm" loop playsinline width="160" height="90"></video>
    <video id="auto" src="/clip.webm" loop autoplay playsinline width="160" height="90"></video>
    <p>
      <button id="same" type="button">Open this page again</button>
      <button id="other" type="button">Open this page on another site</button>
    </p>
    <script>
      const context = new AudioContext();
      const tone = context.createOscillator();
      const volume = context.createGain();
      volume.gain.value = 0.05;
      tone.connect(volume).connect(context.destination);
      tone.start();
      const played = document.getElementById('played');
      const auto = document.getElementById('auto');
      let play = 'pending';
      played.play().then(
        () => (play = 'resolved'),
        (error) => (play = error.name),
      );
      // What the page could start, which the test reads without a click on the page.
      window.report = () => ({
        context: context.state,
        play,
        autoPaused: auto.paused,
        autoTime: auto.currentTime,
        activated: navigator.userActivation.hasBeenActive,
      });
      // When the page ran, and when the video with the autoplay attribute started, with what
      // the page knew then: it tells a test that fails what let the video play.
      window.timeline = [{ event: 'script', at: Date.now() }];
      auto.addEventListener('playing', () =>
        timeline.push({
          event: 'playing',
          at: Date.now(),
          activated: navigator.userActivation.hasBeenActive,
          muted: auto.muted,
          focused: document.hasFocus(),
          visible: document.visibilityState,
        }),
      );
      // A click on the page starts the tone, as players start when people press play.
      addEventListener('pointerdown', () => void context.resume());
      const open = (host) =>
        window.open(`http://${host}:${location.port}/autoplay.html?opened=${host}`);
      document.getElementById('same').addEventListener('click', () => open(location.hostname));
      document.getElementById('other').addEventListener('click', () => open('localhost'));
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sound</title>
  </head>
  <body>
    <p>This page plays a quiet tone.</p>
    <script>
      const context = new AudioContext();
      const tone = context.createOscillator();
      const volume = context.createGain();
      volume.gain.value = 0.05;
      tone.connect(volume).connect(context.destination);
      tone.start();
    </script>
  </body>
</html>
